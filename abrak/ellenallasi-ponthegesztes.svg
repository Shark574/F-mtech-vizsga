<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Ellenállási ponthegesztés</text>

  <!-- upper electrode -->
  <rect x="270" y="60" width="100" height="70" rx="6" fill="#c69a4b" stroke="#7a5a1e" stroke-width="2"/>
  <path d="M290,130 L350,130 L335,160 L305,160 Z" fill="#c69a4b" stroke="#7a5a1e" stroke-width="2"/>
  <text x="385" y="100" font-size="13" fill="#7a5a1e">felső elektróda (Cu)</text>

  <!-- force arrow top -->
  <line x1="320" y1="40" x2="320" y2="58" stroke="#c62828" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="52" font-size="13" fill="#c62828" font-weight="bold">F (erő)</text>

  <!-- upper sheet -->
  <rect x="120" y="160" width="400" height="30" fill="#b0b7bd" stroke="#555" stroke-width="1.5"/>
  <text x="530" y="178" font-size="12" fill="#333">lemez 1</text>
  <!-- lower sheet -->
  <rect x="120" y="190" width="400" height="30" fill="#9aa1a7" stroke="#555" stroke-width="1.5"/>
  <text x="530" y="208" font-size="12" fill="#333">lemez 2</text>

  <!-- weld nugget -->
  <ellipse cx="320" cy="190" rx="34" ry="26" fill="#ff8a3d" stroke="#c62828" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a1a00">hegfészek</text>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#c62828">(megolvadt, majd dermedő anyag)</text>

  <!-- lower electrode -->
  <path d="M305,250 L335,250 L350,280 L290,280 Z" fill="#c69a4b" stroke="#7a5a1e" stroke-width="2"/>
  <rect x="270" y="280" width="100" height="70" rx="6" fill="#c69a4b" stroke="#7a5a1e" stroke-width="2"/>
  <text x="385" y="320" font-size="13" fill="#7a5a1e">alsó elektróda (Cu)</text>

  <!-- force arrow bottom -->
  <line x1="320" y1="372" x2="320" y2="352" stroke="#c62828" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="372" font-size="13" fill="#c62828" font-weight="bold">F (erő)</text>

  <!-- current path -->
  <line x1="200" y1="95" x2="320" y2="95" stroke="#1565c0" stroke-width="2"/>
  <line x1="200" y1="95" x2="200" y2="190" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="200" y1="315" x2="320" y2="315" stroke="#1565c0" stroke-width="2"/>
  <line x1="200" y1="315" x2="200" y2="190" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="150" y="245" font-size="13" fill="#1565c0" font-weight="bold">I (áram)</text>

  <!-- transformer symbol -->
  <rect x="60" y="150" width="60" height="150" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="230" text-anchor="middle" font-size="11" fill="#1565c0">transz-</text>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#1565c0">formátor</text>
  <text x="90" y="260" text-anchor="middle" font-size="10" fill="#1565c0">kis U, nagy I</text>
  <line x1="120" y1="190" x2="200" y2="190" stroke="#1565c0" stroke-width="2"/>

  <!-- Joule heat note -->
  <text x="320" y="420" text-anchor="middle" font-size="13" fill="#333">A hő az érintkezési ellenálláson keletkezik:  Q = I² · R · t</text>
  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#555">(a legnagyobb R a két lemez érintkezésénél van → ott olvad meg az anyag)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
