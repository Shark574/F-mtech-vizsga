<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Jominy-féle véglapos edzési próba</text>

  <!-- left: test setup -->
  <text x="150" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A kísérleti elrendezés</text>
  <!-- specimen rod -->
  <rect x="130" y="75" width="40" height="150" fill="#d7d7d7" stroke="#555" stroke-width="2"/>
  <text x="178" y="95" font-size="11" fill="#333">izzított</text>
  <text x="178" y="110" font-size="11" fill="#333">próbatest</text>
  <text x="178" y="125" font-size="11" fill="#333">(austenitesítve)</text>
  <!-- flange -->
  <rect x="115" y="70" width="70" height="8" fill="#9e9e9e" stroke="#555"/>
  <!-- water jet -->
  <line x1="150" y1="260" x2="150" y2="230" stroke="#1565c0" stroke-width="3"/>
  <path d="M142,248 Q150,238 158,248" fill="none" stroke="#1565c0" stroke-width="2"/>
  <path d="M138,256 Q150,242 162,256" fill="none" stroke="#1565c0" stroke-width="2"/>
  <circle cx="150" cy="275" r="10" fill="#bbdefb" stroke="#1565c0"/>
  <text x="178" y="268" font-size="11" fill="#1565c0">vízsugár alulról</text>
  <text x="178" y="283" font-size="11" fill="#1565c0">(véglap hűtése)</text>
  <text x="130" y="320" font-size="11" fill="#333">→ a hűtési sebesség a</text>
  <text x="130" y="336" font-size="11" fill="#333">véglaptól távolodva csökken</text>

  <!-- right: hardness curve -->
  <text x="500" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A keménység lefutása</text>
  <line x1="390" y1="360" x2="650" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="390" y1="360" x2="390" y2="80" stroke="#333" stroke-width="2"/>
  <text x="520" y="395" text-anchor="middle" font-size="12" fill="#333">távolság a hűtött véglaptól [mm]</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90 360 220)">keménység [HRC]</text>

  <!-- curve: high-hardenability (shallow slope) -->
  <path d="M390,110 C450,120 520,150 650,185" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="560" y="150" font-size="11" fill="#2e7d32">jól átedződő (ötvözött)</text>

  <!-- curve: low-hardenability (steep drop) -->
  <path d="M390,110 C420,130 450,250 650,330" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <text x="470" y="300" font-size="11" fill="#c62828">rosszul átedződő (ötvözetlen)</text>

  <text x="395" y="100" font-size="10" fill="#555">véglap</text>
  <text x="600" y="375" font-size="10" fill="#555">mag felé →</text>
</svg>
